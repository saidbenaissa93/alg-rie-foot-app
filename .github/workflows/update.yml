name: Update Algeria Foot Data

on:
  schedule:
    - cron: "0 6 * * *"    # 8h heure Algérie (UTC+1)
    - cron: "0 18 * * *"   # 20h heure Algérie (UTC+1)

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Transfermarkt scraper
        run: python scripts/scrape_transfermarkt.py

      - name: Run Futbin scraper
        run: python scripts/scrape_futbin.py

      - name: Run Wikipedia matches scraper
        run: python scripts/scrape_wiki_matches.py

      - name: Run Wikipedia records scraper
        run: python scripts/scrape_wiki_player_rec.py

      - name: Run Wikipedia competition scraper
        run: python scripts/scrape_wiki_competition.py

      - name: Create SQL view
        run: python scripts/create_player_view.py

      - name: Generate site
        run: python scripts/generate_site.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add .

          git diff --staged --quiet || git commit -m "Daily data update"

          git push
